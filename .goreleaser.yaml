# GoReleaser v2 — binaires de release pour windows/amd64, linux/amd64 et
# linux/arm64. Déclenché par le workflow .github/workflows/release.yml au push
# d'un tag v*. La SPA doit être compilée AVANT (le binaire l'embarque via
# go:embed) ; le workflow s'en charge, le hook ci-dessous ne fait que vérifier.
version: 2

project_name: fragments

before:
  hooks:
    - sh -c "test -f web/dist/index.html || { echo 'web/dist est vide — construire la SPA d abord (cd web && npm run build)'; exit 1; }"

builds:
  - id: fragments
    main: ./cmd/fragments
    binary: fragments
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

  # Uploader interactif carte SD / téléphone (remplace upload-to-s3.sh).
  # Linux seulement pour l'instant : la détection des volumes (/run/media,
  # gvfs) est spécifique à Linux ; Windows viendra plus tard.
  - id: fragments-upload
    main: ./cmd/fragments-upload
    binary: fragments-upload
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

# Une archive PAR build : fragments-upload ne cible que Linux alors que
# fragments sort aussi en Windows — les mélanger dans l'archive par défaut
# donne un nombre de binaires différent selon la plateforme, ce que GoReleaser
# refuse (multiple-binaries-archive). Séparer sert aussi l'utilisateur qui ne
# veut que l'uploader sur son poste.
archives:
  - id: fragments
    ids: [fragments]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - .env.example

  - id: fragments-upload
    ids: [fragments-upload]
    # Le défaut reprendrait project_name et collisionnerait avec l'archive
    # principale sur les plateformes communes.
    name_template: 'fragments-upload_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE
      - .env.example

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs'
      - '^chore'

release:
  header: |
    **fragments** — cataloguez vos photos stockées sur un bucket S3 et
    triez-les depuis une galerie web auto-hébergée. Binaires Windows et Linux
    ci-dessous ; voir le
    [README](https://github.com/JeffCorporation/fragments#readme) pour la
    prise en main.
